<!DOCTYPE html>
<html>
<head>
  <title>Book Appointment - Mapresh Daniels Beauty & Co</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <script src="script.js" defer></script>
</head>
<body>

<header>
    <div class="company-name">Mapresh Daniels Beauty & Co</div>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="products.html">Products</a>
    <a href="contact.html">Book Now</a>
</nav>

<section class="hero">
    <h1>Book Your Appointment</h1>
    <p>Malamulele, Phaweni Village</p>
</section>

<section class="section">
    <h2>Contact Us</h2>
    <form>
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email" required>
        <input type="tel" placeholder="Phone Number" required>
        <select required>
            <option value="">Select Service</option>
            <option value="hair">Hair Styling</option>
            <option value="nails">Nails</option>
            <option value="skincare">Skin Care</option>
        </select>
        <textarea placeholder="Additional Notes"></textarea>
        <button type="submit">Book Now</button>
    </form>
</section>

<footer>
    © 2026 Mapresh Daniels Beauty & Co
</footer>

<!-- AI Chat Widget -->
<div id="ai-chat-toggle">💬 Chat</div>
<div id="ai-chat-widget">
    <div id="ai-chat-header">Hi! I'm Mapresh AI</div>
    <div id="ai-chat-messages"></div>
    <input type="text" id="ai-chat-input" placeholder="Ask a question..." />
</div>

</body>
</html>
